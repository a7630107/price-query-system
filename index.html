<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>前途查询系统</title>
<style>
  :root{
    --primary-50:#eef4ff; --primary-100:#d9e6ff; --primary-200:#bcd2ff;
    --primary-300:#8eb6ff; --primary-400:#5991fd; --primary-500:#3b6ef5;
    --primary-600:#2550ea; --primary-700:#1d3dd8;
    --gray-50:#f8fafc; --gray-100:#f1f5f9; --gray-200:#e2e8f0; --gray-300:#cbd5e1;
    --gray-400:#94a3b8; --gray-500:#64748b; --gray-600:#475569; --gray-700:#334155;
    --gray-800:#1e293b; --gray-900:#0f172a;
    --success-50:#f0fdf4; --success-500:#22c55e; --success-600:#16a34a;
    --warning-50:#fffbeb; --warning-500:#f59e0b;
    --error-50:#fef2f2; --error-500:#ef4444; --error-600:#dc2626;
    --shadow-sm:0 1px 2px 0 rgb(15 23 42 / .05);
    --shadow-md:0 4px 6px -1px rgb(15 23 42 / .08), 0 2px 4px -2px rgb(15 23 42 / .04);
    --shadow-lg:0 10px 15px -3px rgb(15 23 42 / .1), 0 4px 6px -4px rgb(15 23 42 / .06);
    --shadow-xl:0 20px 25px -5px rgb(15 23 42 / .1), 0 8px 10px -6px rgb(15 23 42 / .04);
    --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-xl:24px;
    --transition-fast:150ms ease; --transition-normal:250ms ease;
  }
  *{margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{font-size:16px;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#7c8bd4 0%,#5a6ab8 50%,#46549a 100%);
    background-attachment:fixed;
    min-height:100vh; color:var(--gray-800); line-height:1.5;
    display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
  }
  .bg-decoration{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0;}
  .bg-decoration::before,.bg-decoration::after{content:''; position:absolute; border-radius:50%; filter:blur(80px); opacity:.35;}
  .bg-decoration::before{width:400px; height:400px; background:#a5b4fc; top:-100px; right:-120px;}
  .bg-decoration::after{width:360px; height:360px; background:#818cf8; bottom:-80px; left:-100px;}

  .app{position:relative; z-index:1; flex:1; display:flex; flex-direction:column; width:100%;}
  .app-header{padding:16px 20px; display:flex; align-items:center; justify-content:space-between; color:#fff;}
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:1.125rem; letter-spacing:-.02em;}
  .brand-icon{width:32px; height:32px; background:#fff; border-radius:8px; display:flex; align-items:center;
    justify-content:center; color:var(--primary-600); font-size:1rem; font-weight:800;}
  .brand-title{cursor:text; user-select:none; padding:2px 6px; border-radius:4px; transition:background .15s;}
  .brand-title:hover{background:rgba(255,255,255,.12);}
  .brand-title-edit{padding:4px 8px; font-size:.9rem; font-weight:600; border-radius:4px;
    border:1px solid #fff; background:rgba(255,255,255,.9); color:var(--gray-900); outline:none;
    width:auto; min-width:120px;}
  .header-actions{display:flex; align-items:center; gap:10px;}
  .header-user{display:flex; flex-direction:column; align-items:flex-end; line-height:1.2;}
  .header-name{font-size:.875rem; font-weight:600;}
  .role-tag{font-size:11px; padding:2px 8px; border-radius:999px; background:rgba(255,255,255,.22); color:#fff;}
  .user-avatar{width:34px; height:34px; border-radius:50%; background:#fff; color:var(--primary-600);
    display:flex; align-items:center; justify-content:center; font-weight:600; font-size:.875rem;
    border:2px solid rgb(255 255 255 / .4); flex-shrink:0;}
  .header-logout{border:1px solid rgba(255,255,255,.5); background:transparent; color:#fff; height:34px;
    padding:0 12px; border-radius:10px; font-size:13px; cursor:pointer; white-space:nowrap;}

  .screen{display:none; flex:1; flex-direction:column; align-items:center; justify-content:flex-start; padding:20px; animation:fadeIn .3s ease;}
  .screen.active{display:flex;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  .card{background:#fff; border-radius:var(--radius-xl); box-shadow:var(--shadow-xl); width:100%; max-width:440px; padding:32px 28px;}
  .card--wide{max-width:720px;}
  .login-margin{margin-top:6vh;}
  .card-header{margin-bottom:24px;}
  .card-title{font-size:1.5rem; font-weight:700; color:var(--gray-900); letter-spacing:-.02em; margin-bottom:6px;}
  .card-title--center{text-align:center;}
  .card-subtitle{font-size:.9375rem; color:var(--gray-500);}

  .form-group{margin-bottom:18px;}
  .form-label{display:block; font-size:.875rem; font-weight:500; color:var(--gray-700); margin-bottom:7px;}
  .form-label .required{color:var(--error-500); margin-right:3px;}
  .form-input,.form-select{width:100%; padding:12px 14px; font-size:.9375rem; color:var(--gray-800);
    background:#fff; border:1px solid var(--gray-200); border-radius:var(--radius-md);
    transition:all var(--transition-fast); outline:none; font-family:inherit;}
  .form-input::placeholder,.form-select::placeholder{color:var(--gray-400);}
  .form-input:hover,.form-select:hover{border-color:var(--gray-300);}
  .form-input:focus,.form-select:focus{border-color:var(--primary-400); box-shadow:0 0 0 3px var(--primary-100);}
  .form-input.has-error{border-color:var(--error-500); box-shadow:0 0 0 3px var(--error-50);}
  .error-msg{display:none; font-size:.8125rem; color:var(--error-600); margin-top:6px;}
  .error-msg.visible{display:block;}
  .hint-box{background:var(--primary-50); border:1px solid var(--primary-100); border-radius:var(--radius-md);
    padding:12px 14px; margin-top:20px; font-size:.8125rem; color:var(--gray-600); line-height:1.7;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 20px;
    font-size:.9375rem; font-weight:600; border:none; border-radius:var(--radius-md); cursor:pointer;
    transition:all var(--transition-fast); text-decoration:none; font-family:inherit; outline:none;}
  .btn--primary{background:linear-gradient(135deg,var(--primary-500),var(--primary-600)); color:#fff; width:100%;
    box-shadow:0 4px 12px rgb(59 110 245 / .25);}
  .btn--primary:hover{background:linear-gradient(135deg,var(--primary-600),var(--primary-700)); transform:translateY(-1px);
    box-shadow:0 6px 16px rgb(59 110 245 / .32);}
  .btn--primary:active{transform:translateY(0);}
  .btn--secondary{background:var(--gray-100); color:var(--gray-700);}
  .btn--secondary:hover{background:var(--gray-200);}
  .btn--outline{background:transparent; color:var(--primary-600); border:1px solid var(--primary-200);}
  .btn--outline:hover{background:var(--primary-50);}
  .btn--sm{padding:8px 14px; font-size:.8125rem;}
  .btn:disabled{opacity:.6; cursor:not-allowed; transform:none !important;}

  .toolbar{display:flex; gap:10px; margin-bottom:20px;}
  .toolbar .btn{flex:1;}

  .chips{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 10px; margin-bottom:4px; -webkit-overflow-scrolling:touch;}
  .chip{flex:0 0 auto; padding:8px 14px; border-radius:999px; background:var(--primary-50); color:#3a4a7a;
    font-size:13px; border:1px solid var(--primary-100); cursor:pointer; white-space:nowrap; transition:all var(--transition-fast);}
  .chip.on{background:var(--primary-500); color:#fff; border-color:var(--primary-500);}

  .row2{display:flex; gap:10px; margin:6px 0 16px;}
  .row2 .form-select{flex:1; height:46px; padding:0 12px;}

  .results-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .results-title{font-size:1rem; font-weight:600; color:var(--gray-800);}
  .results-count{font-size:.8125rem; color:var(--gray-500);}

  .table-wrap{overflow-x:auto; border:1px solid var(--gray-100); border-radius:var(--radius-lg);}
  table{width:100%; border-collapse:collapse; font-size:13px; min-width:640px;}
  thead th{background:#f3f6ff; color:#3a4a7a; text-align:left; padding:10px 10px; font-weight:700;
    border-bottom:1px solid var(--gray-200); white-space:nowrap; position:sticky; top:0;}
  tbody td{padding:10px; border-bottom:1px solid #f0f2f8; vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--gray-50);}
  .cust{font-weight:600; color:var(--gray-800);}
  .grp{display:inline-block; font-size:11px; padding:2px 7px; border-radius:6px; background:var(--primary-50); color:#3a4a7a;}
  .price{font-weight:700; color:var(--success-600); white-space:nowrap;}
  .price.empty{color:var(--gray-400); font-weight:500;}
  .op{white-space:nowrap;}
  .op button{border:1px solid var(--primary-300); color:var(--primary-600); background:#fff; border-radius:8px;
    padding:5px 10px; font-size:12px; cursor:pointer; transition:all var(--transition-fast);}
  .op button:hover{background:var(--primary-50);}

  .empty-state{text-align:center; color:var(--gray-400); padding:40px 20px;}
  .empty-state__icon{font-size:2.5rem; margin-bottom:12px; opacity:.6;}
  .empty-state__text{font-size:.9375rem;}

  .footer-note{color:rgba(255,255,255,.75); font-size:11px; line-height:1.6; margin-top:18px; padding:0 4px;}

  #toast{position:fixed; left:50%; bottom:calc(30px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px);
    background:rgba(20,26,40,.92); color:#fff; padding:11px 18px; border-radius:10px; font-size:14px; opacity:0;
    pointer-events:none; transition:opacity .2s, transform .2s; z-index:99; max-width:86%; text-align:center;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .hidden{display:none !important;}

  /* 用户管理弹层 */
  .modal-mask{position:fixed; inset:0; background:rgba(15,23,42,.55); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; z-index:100; padding:16px;}
  .modal-mask.show{display:flex;}
  .modal-panel{background:#fff; border-radius:var(--radius-lg); width:100%; max-width:560px;
    max-height:84vh; display:flex; flex-direction:column; box-shadow:var(--shadow-xl); overflow:hidden;}
  .modal-head{display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; border-bottom:1px solid var(--gray-100);}
  .modal-head h3{margin:0; font-size:1.05rem; color:var(--gray-900);}
  .modal-close{background:none; border:none; font-size:1.6rem; line-height:1; color:var(--gray-400);
    cursor:pointer; padding:0 4px;}
  .modal-close:hover{color:var(--gray-700);}
  .modal-body{padding:16px 18px; overflow-y:auto; flex:1;}
  .user-row{display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 14px; border:1px solid var(--gray-100); border-radius:var(--radius-md); margin-bottom:10px; background:var(--gray-50);}
  .user-row-info{display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-width:0;}
  .user-row-name{font-weight:600; color:var(--gray-900);}
  .user-row-count{font-size:.8125rem; color:var(--gray-500);}
  .user-row-ops{display:flex; gap:8px; flex-shrink:0;}
  .btn--danger{background:var(--error-50); color:var(--error-600);}
  .btn--danger:hover{background:var(--error-500); color:#fff;}
  .btn--ghost{background:transparent; color:var(--primary-600); border:1px solid var(--primary-200); padding:8px 12px; font-size:.8125rem;}
  .btn--ghost:hover{background:var(--primary-50);}
  .switch-link{text-align:center; margin-top:16px; font-size:.875rem; color:var(--gray-500);}
  .link-text{color:var(--primary-600); cursor:pointer; font-weight:600;}
  .link-text:hover{text-decoration:underline;}
  .user-row-pw-wrap{display:inline-flex; align-items:center; gap:6px; font-size:.8125rem; color:var(--gray-600);}
  .user-row-pw{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-weight:600; color:var(--gray-800); letter-spacing:1px;}
  .pw-toggle{border:1px solid var(--primary-200); background:#fff; color:var(--primary-600); border-radius:6px; padding:2px 7px; font-size:12px; cursor:pointer; line-height:1;}
  .pw-toggle:hover{background:var(--primary-50);}
  .perm-tools{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
  .perm-head{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
  .perm-user{flex:1; font-weight:600; color:var(--gray-900);}
  .perm-list{border:1px solid var(--gray-200); border-radius:var(--radius-md); max-height:38vh; overflow-y:auto; padding:6px 4px; margin-bottom:14px;}
  .perm-item{display:flex; align-items:center; gap:8px; padding:7px 10px; font-size:.875rem; color:var(--gray-700); cursor:pointer; border-radius:6px;}
  .perm-item:hover{background:var(--gray-50);}
  .perm-item input{width:16px; height:16px; accent-color:var(--primary-500); flex-shrink:0;}
  .add-user-form{display:flex; gap:8px; margin-top:14px; padding-top:14px; border-top:1px dashed var(--gray-200);}
  .add-user-form input{flex:1; padding:9px 12px; font-size:.875rem; border:1px solid var(--gray-200);
    border-radius:var(--radius-md); outline:none; font-family:inherit; min-width:0;}
  .add-user-form input:focus{border-color:var(--primary-400); box-shadow:0 0 0 3px var(--primary-100);}
  .perm-save-row{display:flex; gap:8px;}
  .perm-save-row .btn{flex:1;}

  @media (max-width:480px){
    .user-row{flex-direction:column; align-items:stretch;}
    .user-row-ops{justify-content:flex-end;}
    .add-user-form{flex-wrap:wrap;}
    .add-user-form .btn{flex:1;}
  }

  @media (max-width:480px){
    .card{padding:26px 22px; border-radius:var(--radius-lg);}
    .card-title{font-size:1.375rem;}
    .login-margin{margin-top:3vh;}
    .app-header{padding:14px 16px;}
  }
  @media (min-width:768px){
    .screen{justify-content:center; padding:32px 24px;}
  }
</style>
</head>
<body>
<div class="bg-decoration"></div>

<div class="app">
  <header class="app-header">
    <div class="brand" id="appBrand">
      <div class="brand-icon">前</div>
      <span id="brandTitle" class="brand-title" title="双击编辑标题">前途查询系统</span>
    </div>
    <div class="header-actions" id="headerActions"></div>
  </header>

  <!-- 登录屏 -->
  <section class="screen active" id="loginScreen">
    <div class="card login-margin">
      <div class="card-header">
        <h1 class="card-title">用户登录</h1>
      </div>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label"><span class="required">*</span>姓名</label>
          <input type="text" class="form-input" placeholder="请输入姓名" id="loginName" autocomplete="off" />
        </div>
        <div class="form-group">
          <label class="form-label"><span class="required">*</span>口令</label>
          <input type="password" class="form-input" placeholder="请输入口令" id="loginPass" />
          <div class="error-msg" id="loginErr"></div>
        </div>
        <div class="form-group" style="margin-top:22px; margin-bottom:0;">
          <button type="submit" class="btn btn--primary">登 录</button>
        </div>
      </form>
    </div>
  </section>

  <!-- 查询屏 -->
  <section class="screen" id="appScreen">
    <div class="card card--wide">
      <div class="card-header">
        <h1 class="card-title card-title--center">前途查询系统</h1>
        <p class="card-subtitle" id="curScope" style="text-align:center;"></p>
      </div>

      <div id="adminTools" class="hidden">
        <div class="toolbar">
          <a class="btn btn--secondary" id="feishuBtn" href="https://fcn3e2ps47y6.feishu.cn/base/IM2JbwsQLaD0MVspSQvcSFMLntf?from=from_copylink" target="_blank" rel="noopener noreferrer" title="维护价格及权限请到飞书多维表">飞书数据源</a>
          <button class="btn btn--secondary" id="userManageBtn">用户管理</button>
        </div>
        <div class="hint-box" style="margin-top:0;">
          数据同步说明：飞书多维表的改动每小时自动同步到本站；如需立即同步，请打开
          <a href="https://github.com/a7630107/price-query-system/actions" target="_blank" rel="noopener noreferrer">GitHub 仓库 Actions 页面</a>
          → 左侧选「sync」 → 右上角「Run workflow」 → 点绿色按钮，约 1 分钟后刷新本站。
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">搜索</label>
        <input class="form-input" id="searchInput" placeholder="搜索 客户 / 产品名称 / 规格型号 / 物料组" />
      </div>

      <div class="chips" id="groupChips"></div>

      <div class="row2">
        <select class="form-select" id="customerSel"><option value="">全部客户</option></select>
      </div>

      <div class="results-header">
        <h3 class="results-title">查询结果</h3>
        <span class="results-count" id="countText"></span>
      </div>

      <div id="resultBody"></div>

      <div class="footer-note">
        说明：本文件为<strong>离线单机版</strong>，数据与权限均内置在文件中，便于携带、双击即用。权限为前端筛选（便于按分管范围查看），并非服务端强制隔离；
        如需严格权限管控请使用服务端版本。单价默认内置为空，管理员可就地录入并导出/导入 CSV 在本地保存。
      </div>
    </div>
  </section>
</div>

<div id="toast"></div>

<!-- 用户管理弹层 -->
<div class="modal-mask" id="userModal">
  <div class="modal-panel">
    <div class="modal-head">
      <h3 id="userModalTitle">用户管理</h3>
      <button class="modal-close" id="userModalClose">×</button>
    </div>
    <div class="modal-body" id="userModalBody"></div>
  </div>
</div>

<!-- 修改/重置密码弹层 -->
<div class="modal-mask" id="pwdModal">
  <div class="modal-panel">
    <div class="modal-head">
      <h3 id="pwdModalTitle">修改密码</h3>
      <button class="modal-close" id="pwdModalClose">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group" id="oldPwdGroup">
        <label class="form-label"><span class="required">*</span>当前口令</label>
        <input type="password" class="form-input" id="oldPwd" autocomplete="off" />
      </div>
      <div class="form-group">
        <label class="form-label"><span class="required">*</span>新口令</label>
        <input type="password" class="form-input" id="newPwd" autocomplete="off" />
      </div>
      <div class="form-group">
        <label class="form-label"><span class="required">*</span>确认新口令</label>
        <input type="password" class="form-input" id="newPwd2" autocomplete="off" />
        <div class="error-msg" id="pwdErr"></div>
      </div>
      <button class="btn btn--primary" id="pwdSave">保存</button>
    </div>
  </div>
</div>

/* ===== 运行时状态 ===== */
let currentUser = null;
let priceOverrides = {};   // "客户|产品名称|规格型号|单位" -> 单价字符串
let activeGroup = "";
let activeCustomer = "";
let searchTerm = "";

const $ = (id) => document.getElementById(id);
const screens = { login: $('loginScreen'), app: $('appScreen') };

/* ===== 工具 ===== */
function loadPrices(){
  try { priceOverrides = JSON.parse(localStorage.getItem('pq_prices') || '{}'); }
  catch(e){ priceOverrides = {}; }
}
function savePrices(){
  localStorage.setItem('pq_prices', JSON.stringify(priceOverrides));
}
function keyOf(p){ return [p.customer, p.productName, p.spec, p.unit].join('|'); }
function getPrice(p){
  const k = keyOf(p);
  if (Object.prototype.hasOwnProperty.call(priceOverrides, k)) return priceOverrides[k];
  return (p.price === null || p.price === undefined) ? null : String(p.price);
}
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 1800);
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function setLoginError(msg){
  const err = $('loginErr');
  err.textContent = msg;
  err.classList.toggle('visible', !!msg);
  $('loginName').classList.toggle('has-error', !!msg);
  $('loginPass').classList.toggle('has-error', !!msg);
}

/* ===== 界面切换 ===== */
function showScreen(name){
  Object.keys(screens).forEach(k => screens[k].classList.remove('active'));
  screens[name].classList.add('active');
  // 登录后隐藏左上角图标/品牌，登录页保留
  const brand = $('appBrand');
  if (brand) brand.style.display = (name === 'app') ? 'none' : '';
  updateHeader();
}
function updateHeader(){
  const box = $('headerActions');
  if (!currentUser){ box.innerHTML = ''; return; }
  const roleText = currentUser.role === 'admin' ? '管理员' : (currentUser.role === 'sales' ? '业务员' : '普通用户');
  box.innerHTML = `
    <span class="header-user">
      <span class="header-name">${esc(currentUser.name)}</span>
      <span class="role-tag">${roleText}</span>
    </span>
    <div class="user-avatar">${esc(currentUser.name.charAt(0))}</div>
    <button class="btn header-logout" id="changePwdBtn">修改密码</button>
    <button class="btn header-logout" id="logoutBtn">退出</button>`;
  $('logoutBtn').onclick = doLogout;
  $('changePwdBtn').onclick = () => openPwdModal(null);
}

/* ===== 登录 ===== */
function doLogin(){
  const name = $('loginName').value.trim();
  const pass = $('loginPass').value;
  setLoginError('');
  if (!name || !pass){ setLoginError('请输入姓名和口令'); return; }
  const u = USERS.find(x => x.name === name);
  if (!u || u.passcode !== pass){ setLoginError('姓名或口令错误'); return; }
  currentUser = u;
  localStorage.setItem('pq_currentUser', name);
  showApp();
}
function doLogout(){
  currentUser = null;
  localStorage.removeItem('pq_currentUser');
  $('loginPass').value = '';
  $('loginName').value = '';
  showScreen('login');
}

/* ===== 应用 ===== */
function baseData(){
  if (currentUser.role === 'admin') return PRODUCTS;
  const units = currentUser.managedUnits || [];
  return PRODUCTS.filter(p => units.includes(p.customer));
}
function showApp(){
  showScreen('app');
  const b = baseData();
  $('curScope').textContent = currentUser.role === 'admin'
      ? '全部客户（' + new Set(PRODUCTS.map(p=>p.customer)).size + ' 家）'
      : ((currentUser.managedUnits || []).length
          ? '分管 ' + currentUser.managedUnits.length + ' 家客户'
          : '暂无可查询范围，请联系管理员开通');
  $('adminTools').classList.toggle('hidden', currentUser.role !== 'admin');
  buildGroupChips(b);
  buildCustomerSel(b);
  render();
}
function buildGroupChips(data){
  const groups = Array.from(new Set(data.map(p => p.materialGroup))).sort();
  let html = `<div class="chip ${activeGroup===''?'on':''}" data-g="">全部物料组</div>`;
  html += groups.map(g => `<div class="chip ${activeGroup===g?'on':''}" data-g="${esc(g)}">${esc(g)}</div>`).join('');
  const box = $('groupChips');
  box.innerHTML = html;
  box.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    activeGroup = c.getAttribute('data-g');
    buildGroupChips(baseData());
    render();
  });
}
function buildCustomerSel(data){
  const sel = $('customerSel');
  const set = Array.from(new Set(data.map(p => p.customer))).sort();
  let html = '<option value="">全部客户</option>';
  html += set.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  sel.innerHTML = html;
  sel.value = activeCustomer && set.includes(activeCustomer) ? activeCustomer : '';
  sel.onchange = () => { activeCustomer = sel.value; render(); };
}
function filtered(){
  let data = baseData();
  if (activeGroup) data = data.filter(p => p.materialGroup === activeGroup);
  if (activeCustomer) data = data.filter(p => p.customer === activeCustomer);
  const q = searchTerm.trim().toLowerCase();
  if (q){
    data = data.filter(p =>
      (p.customer+p.productName+p.spec+p.materialGroup).toLowerCase().includes(q));
  }
  return data;
}
function render(){
  const data = filtered();
  const isAdmin = currentUser && currentUser.role === 'admin';
  $('countText').textContent = '共 ' + data.length + ' 条结果';
  const box = $('resultBody');
  if (!currentUser || (currentUser.role !== 'admin' && (currentUser.managedUnits || []).length === 0)){
    box.innerHTML = '<div class="empty-state"><div class="empty-state__icon">🔒</div><p class="empty-state__text">您当前暂无可查询的客户范围。<br>请联系管理员为您的账号分配查询权限。</div>';
    return;
  }
  if (data.length === 0){
    box.innerHTML = '<div class="empty-state"><div class="empty-state__icon">🔍</div><p class="empty-state__text">没有匹配的记录，试试调整搜索词或筛选条件。</div>';
    return;
  }
  let rows = data.map(p => {
    const pr = getPrice(p);
    const prHtml = pr === null
      ? '<span class="price empty">—</span>'
      : '<span class="price">¥' + esc(pr) + '</span>';
    const op = isAdmin ? `<div class="op"><button data-k="${esc(keyOf(p))}">编辑单价</button></div>` : '';
    return `<tr>
      <td class="cust">${esc(p.customer)}</td>
      <td><span class="grp">${esc(p.materialGroup)}</span></td>
      <td>${esc(p.productName)}</td>
      <td>${esc(p.spec)}</td>
      <td>${esc(p.unit)}</td>
      <td>${prHtml}</td>
      ${isAdmin ? '<td>'+op+'</td>' : ''}
    </tr>`;
  }).join('');
  const headOp = isAdmin ? '<th>操作</th>' : '';
  box.innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>客户</th><th>物料组</th><th>产品名称</th><th>规格型号</th><th>单位</th><th>单价</th>${headOp}</tr></thead>
    <tbody>${rows}</tbody></table></div>`;
  if (isAdmin){
    box.querySelectorAll('.op button').forEach(b => b.onclick = () => editPrice(b.getAttribute('data-k')));
  }
}
function editPrice(k){
  const cur = Object.prototype.hasOwnProperty.call(priceOverrides, k) ? priceOverrides[k]
            : (() => { const f = PRODUCTS.find(p => keyOf(p) === k); return f && f.price != null ? String(f.price) : ''; })();
  const input = prompt('录入单价（元/吨），留空表示未填：', cur || '');
  if (input === null) return; // 取消
  const v = input.trim();
  if (v === ''){ delete priceOverrides[k]; }
  else {
    const n = Number(v);
    if (isNaN(n) || n < 0){ toast('请输入合法数字'); return; }
    priceOverrides[k] = String(n);
  }
  savePrices();
  render();
  toast('单价已保存（本机）');
}

  box.querySelectorAll('[data-perm]').forEach(b => b.onclick = () => openPermEditor(b.getAttribute('data-perm')));
  box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteUser(b.getAttribute('data-del')));
  box.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => openPwdModal(b.getAttribute('data-reset')));
  box.querySelectorAll('[data-reveal]').forEach(btn => btn.onclick = () => {
    const row = btn.closest('.user-row');
    const span = row.querySelector('.user-row-pw');
    const shown = span.getAttribute('data-shown') === '1';
    if (shown){
      span.textContent = '••••••';
      span.setAttribute('data-shown','0');
      btn.textContent = '👁';
    } else {
      span.textContent = span.getAttribute('data-pw');
      span.setAttribute('data-shown','1');
      btn.textContent = '🙈';
    }
  });
  $('nuCreate').onclick = createUser;
  $('exportUsersBtn').onclick = exportUsers;
  $('importUsersBtn').onclick = () => $('importUsersFile').click();
  $('importUsersFile').onchange = e => { if (e.target.files[0]) importUsers(e.target.files[0]); e.target.value=''; };
}
function createUser(){
  const name = $('nuName').value.trim();
  const pass = $('nuPass').value.trim();
  if (!name || !pass){ toast('请输入姓名和口令'); return; }
  if (USERS.some(u => u.name === name)){ toast('该姓名已存在'); return; }
  USERS.push({ name, passcode: pass, role: 'sales', dept: '', managedUnits: [] });
  saveUsers();
  toast('已创建，请设置权限范围');
  openPermEditor(name);
}
function deleteUser(name){
  const u = USERS.find(x => x.name === name);
  if (!u) return;
  if (u.role === 'admin'){ toast('不能删除管理员'); return; }
  if (!confirm('确定删除用户「' + name + '」？')) return;
  USERS = USERS.filter(x => x.name !== name);
  saveUsers();
  if (currentUser && currentUser.name === name){
    toast('当前账号已被删除，已退出登录');
    doLogout();
    return;
  }
  renderUserList();
  toast('已删除用户');
}
function openPermEditor(name){
  const u = USERS.find(x => x.name === name);
  if (!u) return;
  permEditingName = name;
  $('userModalTitle').textContent = '设置权限 · ' + name;
  const checked = new Set(u.managedUnits || []);
  let html = `<div class="perm-head">
    <button class="btn btn--ghost btn--sm" id="permBack">← 返回</button>
    <span class="perm-user">${esc(name)} 可见客户</span>
    <button class="btn btn--ghost btn--sm" id="permAll">全选</button>
    <button class="btn btn--ghost btn--sm" id="permNone">清空</button>
  </div>
  <div class="perm-list">`;
  html += ALL_CUSTOMERS.map(c =>
    `<label class="perm-item"><input type="checkbox" value="${esc(c)}" ${checked.has(c) ? 'checked' : ''}>${esc(c)}</label>`
  ).join('');
  html += `</div>
  <div class="perm-save-row">
    <button class="btn btn--primary" id="permSave">保存权限</button>
  </div>`;
  $('userModalBody').innerHTML = html;
  $('permBack').onclick = () => { permEditingName = null; $('userModalTitle').textContent = '用户管理'; renderUserList(); };
  $('permAll').onclick = () => $('userModalBody').querySelectorAll('input[type=checkbox]').forEach(c => c.checked = true);
  $('permNone').onclick = () => $('userModalBody').querySelectorAll('input[type=checkbox]').forEach(c => c.checked = false);
  $('permSave').onclick = savePerm;
}
function savePerm(){
  const u = USERS.find(x => x.name === permEditingName);
  if (!u) return;
  const list = Array.from($('userModalBody').querySelectorAll('input[type=checkbox]:checked')).map(c => c.value);
  u.managedUnits = list;
  saveUsers();
  if (currentUser && currentUser.name === u.name){
    activeGroup = ''; activeCustomer = ''; searchTerm = '';
    showApp();
  }
  toast('权限已保存（本机）');
  permEditingName = null;
  $('userModalTitle').textContent = '用户管理';
  renderUserList();
}

/* ===== 修改 / 重置密码 ===== */
let pwdTarget = null; // null = 修改自己；否则为被管理员重置的用户名
function openPwdModal(target){
  pwdTarget = target || null;
  const isSelf = !pwdTarget;
  $('pwdModalTitle').textContent = isSelf ? '修改密码' : ('重置密码 · ' + pwdTarget);
  $('oldPwdGroup').style.display = isSelf ? '' : 'none';
  $('oldPwd').value = ''; $('newPwd').value = ''; $('newPwd2').value = '';
  setPwdError('');
  $('pwdModal').classList.add('show');
  if (isSelf) $('oldPwd').focus(); else $('newPwd').focus();
}
function closePwdModal(){ $('pwdModal').classList.remove('show'); }
function setPwdError(msg){ const e = $('pwdErr'); e.textContent = msg; e.classList.toggle('visible', !!msg); }
function savePwd(){
  const newP = $('newPwd').value;
  const newP2 = $('newPwd2').value;
  setPwdError('');
  if (newP === '' || newP2 === ''){ setPwdError('请填写新口令'); return; }
  if (newP !== newP2){ setPwdError('两次新口令不一致'); return; }
  if (newP.length < 4){ setPwdError('新口令至少 4 位'); return; }
  if (pwdTarget){
    const u = USERS.find(x => x.name === pwdTarget);
    if (u){ u.passcode = newP; saveUsers(); }
    closePwdModal();
    toast('已重置「' + pwdTarget + '」的密码');
    renderUserList();
  } else {
    const oldP = $('oldPwd').value;
    if (oldP !== currentUser.passcode){ setPwdError('当前口令不正确'); return; }
    currentUser.passcode = newP;
    saveUsers();
    closePwdModal();
    toast('密码已修改');
  }
}

/* ===== 用户 CSV 导出/导入（管理员）===== */
function exportUsers(){
  const head = ['姓名','口令','角色','分管客户'];
  const lines = [head.join(',')].concat(USERS.map(u => [
    u.name, u.passcode,
    u.role === 'admin' ? '管理员' : (u.role === 'sales' ? '业务员' : '普通用户'),
    (u.managedUnits || []).join('|')
  ].map(csvCell).join(',')));
  const csv = '\ufeff' + lines.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '用户表.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('已导出 ' + USERS.length + ' 个用户');
}
function importUsers(file){
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCSV(String(reader.result || ''));
    if (rows.length < 2){ toast('文件无数据'); return; }
    const head = rows[0].map(h => h.trim());
    const iName = head.indexOf('姓名'), iPass = head.indexOf('口令'),
          iRole = head.indexOf('角色'), iUnits = head.indexOf('分管客户');
    if (iName < 0 || iPass < 0){ toast('CSV 表头需含：姓名,口令,角色,分管客户'); return; }
    const validUnits = new Set(ALL_CUSTOMERS);
    let created = 0, updated = 0;
    for (let i=1;i<rows.length;i++){
      const r = rows[i];
      const name = (r[iName] || '').trim();
      if (!name) continue;
      const pass = (r[iPass] || '').trim() || '123456';
      const roleTxt = (r[iRole] || '').trim();
      const role = roleTxt === '管理员' ? 'admin' : (roleTxt === '业务员' ? 'sales' : 'user');
      if (role === 'admin'){
        if (!USERS.some(u => u.name === name)){ USERS.push({name, passcode: pass, role:'admin', dept:'', managedUnits:[]}); created++; }
        continue;
      }
      const units = String(r[iUnits] || '').split('|').map(s => s.trim()).filter(s => validUnits.has(s));
      const ex = USERS.find(u => u.name === name);
      if (ex){ ex.passcode = pass; ex.role = role; ex.managedUnits = units; updated++; }
      else { USERS.push({name, passcode: pass, role, dept:'', managedUnits: units}); created++; }
    }
    saveUsers();
    renderUserList();
    toast(`导入完成：新增 ${created} 个，更新 ${updated} 个`);
  };
  reader.readAsText(file, 'UTF-8');
}

/* ===== 管理员 CSV 导出/导入 ===== */
function exportCSV(){
  const rows = PRODUCTS.map(p => {
    const pr = getPrice(p);
    return [p.customer, p.materialGroup, p.productName, p.spec, p.unit, pr === null ? '' : pr];
  });
  const head = ['客户','物料组','产品名称','规格型号','单位','单价'];
  const lines = [head.join(',')].concat(rows.map(r => r.map(csvCell).join(',')));
  const csv = '﻿' + lines.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  a.href = url;
  a.download = `价格表_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('已导出 '+ rows.length +' 条');
}
function csvCell(s){ s = String(s == null ? '' : s); return /[",\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function parseCSV(text){
  const rows = []; let row = [], cur = '', q = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    } else {
      if (c === '"') q = true;
      else if (c === ','){ row.push(cur); cur = ''; }
      else if (c === '\r'){ /* skip */ }
      else if (c === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += c;
    }
  }
  if (cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.length && r.some(c => c.trim() !== ''));
}
function importCSV(file){
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCSV(String(reader.result || ''));
    if (rows.length < 2){ toast('文件无数据'); return; }
    const head = rows[0].map(h => h.trim());
    const idx = {
      customer: head.indexOf('客户'), productName: head.indexOf('产品名称'),
      spec: head.indexOf('规格型号'), unit: head.indexOf('单位'), price: head.indexOf('单价')
    };
    if ([idx.customer, idx.productName, idx.spec, idx.unit, idx.price].some(i => i < 0)){
      toast('CSV 表头需含：客户,产品名称,规格型号,单位,单价'); return;
    }
    let cnt = 0;
    for (let i=1;i<rows.length;i++){
      const r = rows[i];
      const k = [r[idx.customer], r[idx.productName], r[idx.spec], r[idx.unit]].join('|');
      const v = (r[idx.price] || '').trim();
      if (!PRODUCTS.some(p => keyOf(p) === k)) continue; // 不匹配则跳过
      if (v === '') delete priceOverrides[k];
      else { const n = Number(v); if (!isNaN(n) && n >= 0){ priceOverrides[k] = String(n); cnt++; } }
    }
    savePrices(); render();
    toast('已导入 '+ cnt +' 条单价');
  };
  reader.readAsText(file, 'UTF-8');
}

/* ===== 初始化 ===== */
function init(){
  loadPrices();
  const saved = localStorage.getItem('pq_currentUser');
  if (saved){ $('loginName').value = saved; $('loginPass').focus(); }
  $('loginForm').addEventListener('submit', e => { e.preventDefault(); doLogin(); });
  $('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  $('loginName').addEventListener('input', () => setLoginError(''));
  $('loginPass').addEventListener('input', () => setLoginError(''));
  $('searchInput').addEventListener('input', e => { searchTerm = e.target.value; render(); });
  $('userManageBtn').onclick = openUserManager;
  $('userModalClose').onclick = closeUserManager;
  $('userModal').addEventListener('click', e => { if (e.target === $('userModal')) closeUserManager(); });
  $('pwdModalClose').onclick = closePwdModal;
  $('pwdModal').addEventListener('click', e => { if (e.target === $('pwdModal')) closePwdModal(); });
  $('pwdSave').onclick = savePwd;
  ['oldPwd','newPwd','newPwd2'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') savePwd(); }));
  updateHeader();
  initBrandTitle();
}
document.addEventListener('DOMContentLoaded', init);

/* ===== 品牌标题双击编辑 ===== */
const BRAND_TITLE_KEY = 'pq_brandTitle';
const DEFAULT_BRAND_TITLE = '前途查询系统';
function initBrandTitle(){
  const el = document.getElementById('brandTitle');
  if (!el) return;
  const saved = localStorage.getItem(BRAND_TITLE_KEY);
  if (saved) el.textContent = saved;
  el.addEventListener('dblclick', () => {
    const cur = el.textContent;
    const input = document.createElement('input');
    input.type = 'text';
    input.value = cur;
    input.className = 'brand-title-edit';
    input.maxLength = 24;
    el.replaceWith(input);
    input.focus();
    input.select();
    let committed = false;
    const commit = () => {
      if (committed) return;
      committed = true;
      let v = input.value.trim();
      if (!v) v = DEFAULT_BRAND_TITLE;
      if (v.length > 24) v = v.slice(0, 24);
      localStorage.setItem(BRAND_TITLE_KEY, v);
      const span = document.createElement('span');
      span.id = 'brandTitle';
      span.className = 'brand-title';
      span.title = '双击编辑标题';
      span.textContent = v;
      input.replaceWith(span);
      initBrandTitle();
    };
    const cancel = () => {
      if (committed) return;
      committed = true;
      const span = document.createElement('span');
      span.id = 'brandTitle';
      span.className = 'brand-title';
      span.title = '双击编辑标题';
      span.textContent = cur;
      input.replaceWith(span);
      initBrandTitle();
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter'){ e.preventDefault(); commit(); }
      else if (e.key === 'Escape'){ e.preventDefault(); cancel(); }
    });
  });
}
